<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Builder – free, private resume maker with PDF export | Dawson Horvath</title>
    <meta
      name="description"
      content="Make a clean, professional resume in your browser. Pick a template, arrange sections with drag and drop, and download a PDF, HTML page or JSON. Free, no sign-up, and your resume never leaves your computer."
    />
    <meta name="author" content="Dawson Horvath" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dawson Horvath" />
    <meta property="og:title" content="Resume Builder – make a polished resume in minutes" />
    <meta property="og:description" content="Free resume maker with templates, drag and drop layout, and one-click PDF download. Works in your browser, no account needed." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Resume Builder editor next to a two-column resume" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resume Builder – make a polished resume in minutes" />
    <meta name="twitter:description" content="Free resume maker with templates, drag and drop layout, and one-click PDF download." />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Resume Builder",
        "url": "%SITE_URL%",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "description": "Make a clean, professional resume in your browser with templates, drag and drop layout, and PDF, HTML and JSON export.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Dawson Horvath", "url": "%HOME_URL%" },
        "isPartOf": { "@type": "WebSite", "name": "Dawson Horvath", "url": "%HOME_URL%" }
      }
    </script>

    <script>
      // Embedded (?mode=embed) the page stays transparent and skips the intro
      // text below, so the host page shows through until the resume renders.
      if (new URLSearchParams(location.search).get('mode') === 'embed') {
        document.documentElement.classList.add('rg-embedded');
      }
    </script>
    <style>
      /* One page per frame height, snapping page to page; no scrollbar. */
      .rg-embedded { overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
      .rg-embedded::-webkit-scrollbar { display: none; }
      .rg-embedded body { margin: 0; }
      .rg-embedded #root > main { display: none; }
      .rg-embedded .rg-embed { cursor: pointer; }
      .rg-embedded .rg-page { scroll-snap-align: start; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts, and read by search engines. -->
      <main style="max-width: 640px; margin: 15vh auto; padding: 0 16px; font-family: system-ui, sans-serif; color: #1c2230; line-height: 1.5">
        <h1 style="font-size: 28px; margin: 0 0 8px">Resume Builder</h1>
        <p>
          Make a clean, professional resume in your browser. Choose from ten templates, arrange sections with drag and drop, and download a PDF, a web page or a JSON
          file you can open again later. It's free, there's no account, and your resume stays on your computer.
        </p>
        <p>Made by <a href="%HOME_URL%">Dawson Horvath</a>.</p>
        <noscript><p><strong>Resume Builder needs JavaScript turned on.</strong></p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
